name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Release metadata and companion-command checks
        run: |
          VERSION=$(uv run --no-project --python 3.12 python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          uv run --no-project --python 3.12 python scripts/release_preflight.py --version "$VERSION" --allow-existing-tag

  package-smoke:
    name: Package Build & Entrypoint Smoke
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build package artifacts
        run: uv build

      - name: Install wheel into clean venv
        run: |
          uv venv .pkg-smoke --python 3.12
          uv pip install --python .pkg-smoke/bin/python dist/*.whl

      - name: Run installed entrypoint smoke checks
        run: |
          .pkg-smoke/bin/zulipchat-mcp --version
          .pkg-smoke/bin/zulipchat-mcp-setup --version
          .pkg-smoke/bin/zulipchat-mcp-integrate --version
          .pkg-smoke/bin/zulipchat-mcp-integrate list
          .pkg-smoke/bin/zulipchat-mcp-hook --help > /dev/null

      - name: Run installed MCP stdio smoke
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          uv run --no-project --python .pkg-smoke/bin/python scripts/mcp_stdio_smoke.py \
            --expected-version "$VERSION" \
            -- "$PWD/.pkg-smoke/bin/zulipchat-mcp"

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [version-check, package-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Entrypoint smoke checks
        run: |
          uv run zulipchat-mcp --version
          uv run zulipchat-mcp-setup --version
          uv run zulipchat-mcp-integrate --version
          uv run zulipchat-mcp-integrate list
          uv run zulipchat-mcp-hook --help > /dev/null

      - name: MCP stdio smoke
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          uv run python scripts/mcp_stdio_smoke.py \
            --expected-version "$VERSION" \
            -- uv run zulipchat-mcp

      - name: Run tests
        run: uv run pytest -q -m "not slow and not integration"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy src
